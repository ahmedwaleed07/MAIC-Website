name: Prepare MAIC candidate course manual PDFs

on:
  push:
    branches: [main]
    paths:
      - 'data/course-manuscripts/**'
      - 'tools/render_maic_manuscript.py'
      - '.github/workflows/maic-manuscripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-croscore
          python -m pip install --upgrade pip
          python -m pip install reportlab Pillow pypdf
      - name: Check renderer syntax
        run: python -m py_compile tools/render_maic_manuscript.py
      - name: Render all unapproved review candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/maic
          shopt -s nullglob
          files=(data/course-manuscripts/*.md)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No candidate manuscripts found'
            exit 1
          fi
          for source in "${files[@]}"; do
            stem="$(basename "${source%.md}")"
            python tools/render_maic_manuscript.py \
              --input "$source" \
              --crest assets/maic-official-crest.png \
              --montage assets/michigan-heritage-montage.webp \
              --output "dist/maic/${stem}.pdf"
          done
      - name: Upload candidate PDFs for academic review
        uses: actions/upload-artifact@v4
        with:
          name: maic-academic-review-candidates
          path: dist/maic/*.pdf
          if-no-files-found: error
          retention-days: 14
