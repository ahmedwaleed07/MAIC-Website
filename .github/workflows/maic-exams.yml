name: MAIC academic exam safeguards
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/learner/exam.js'
      - 'functions/api/learner/study.js'
      - 'functions/api/admin/exam-banks.js'
      - 'learner/exam.js'
      - 'tools/create_maic_course_pdf.py'
      - 'tests/self-paced-exam.cjs'
      - 'tests/learner-exam-integration.cjs'
      - 'tests/exam-content-quality.cjs'
      - 'tests/course-bank-offline-audit.cjs'
      - 'tests/academic-bank-status.cjs'
      - 'tools/audit_course_bank.cjs'
      - 'tests/exam-two-stage-review-integration.cjs'
      - 'migrations/0008_exam_two_stage_review.sql'
      - 'admin/exam-banks.js'
      - 'functions/_lib/exam-quality.js'
      - 'tests/tinos-academic-release.cjs'
      - 'functions/api/admin/course-material.js'
      - 'admin/course-material.js'
      - '.github/workflows/maic-exams.yml'
  pull_request:
    paths:
      - 'functions/api/learner/exam.js'
      - 'functions/api/learner/study.js'
      - 'functions/api/admin/exam-banks.js'
      - 'learner/exam.js'
      - 'tools/create_maic_course_pdf.py'
      - 'tests/self-paced-exam.cjs'
      - 'tests/learner-exam-integration.cjs'
      - 'tests/exam-content-quality.cjs'
      - 'tests/course-bank-offline-audit.cjs'
      - 'tests/academic-bank-status.cjs'
      - 'tools/audit_course_bank.cjs'
      - 'tests/exam-two-stage-review-integration.cjs'
      - 'migrations/0008_exam_two_stage_review.sql'
      - 'admin/exam-banks.js'
      - 'functions/_lib/exam-quality.js'
      - 'tests/tinos-academic-release.cjs'
      - 'functions/api/admin/course-material.js'
      - 'admin/course-material.js'
      - '.github/workflows/maic-exams.yml'
jobs:
  academic-exam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend and learner-exam safeguards
        run: node --test tests/academic-bank-status.cjs tests/course-bank-offline-audit.cjs tests/self-paced-exam.cjs tests/tinos-academic-release.cjs tests/learner-exam-integration.cjs tests/exam-content-quality.cjs tests/exam-two-stage-review-integration.cjs
      - name: Validate Python PDF generator syntax
        run: python -m py_compile tools/create_maic_course_pdf.py
