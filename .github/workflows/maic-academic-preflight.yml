name: MAIC private academic draft security preflight

on:
  push:
    branches: [main]
    paths:
      - 'admin/exam-candidates.*'
      - 'admin/course-readiness.*'
      - 'functions/api/admin/course-readiness.js'
      - 'tests/course-readiness-admin.cjs'
      - 'functions/api/admin/material-signoff.js'
      - 'admin/material-signoff.*'
      - 'migrations/0013_independent_material_academic_signoff.sql'
      - 'tests/material-human-signoff.cjs'
      - 'functions/api/admin/content.js'
      - 'functions/api/admin/exam-candidates.js'
      - 'migrations/0012_private_exam_candidate_staging.sql'
      - 'data/exam-drafts/**'
      - 'tools/check_no_public_exam_keys.py'
      - 'tests/private-exam-candidates.cjs'
      - '.github/workflows/maic-academic-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no exposed banks in current Git tree
        run: python tools/check_no_public_exam_keys.py
      - name: Verify private candidate route cannot release exams
        run: node --test tests/private-exam-candidates.cjs tests/course-readiness-admin.cjs tests/material-human-signoff.cjs
