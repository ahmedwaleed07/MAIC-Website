name: Audit MAIC staged exam drafts

on:
  push:
    branches: [main]
    paths:
      - 'data/exam-drafts/**'
      - 'data/course-manuscripts/**'
      - 'tools/audit_staged_exam_drafts.py'
      - '.github/workflows/maic-draft-bank-audit.yml'
  pull_request:
    paths:
      - 'data/exam-drafts/**'
      - 'data/course-manuscripts/**'
      - 'tools/audit_staged_exam_drafts.py'
      - '.github/workflows/maic-draft-bank-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 100-item banks and source manuscript versioning
        run: |
          python -m py_compile tools/audit_staged_exam_drafts.py
          python tools/audit_staged_exam_drafts.py
