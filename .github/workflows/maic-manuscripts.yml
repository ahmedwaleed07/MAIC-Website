name: Protect MAIC private course manuscripts

on:
  push:
    branches: [main]
    paths:
      - 'data/course-manuscripts/**'
      - 'tools/check_no_public_manuscripts.py'
      - 'functions/api/admin/manuscripts.js'
      - 'admin/manuscripts.*'
      - 'tests/private-manuscripts.cjs'
      - '.github/workflows/maic-manuscripts.yml'
  pull_request:
    paths:
      - 'data/course-manuscripts/**'
      - 'tools/check_no_public_manuscripts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript-confidentiality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject private full textbooks in public Git
        run: python tools/check_no_public_manuscripts.py
      - name: Check admin-only manuscript retrieval
        run: node --test tests/private-manuscripts.cjs
